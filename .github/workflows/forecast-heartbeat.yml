name: Production forecast heartbeat

on:
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-forecast-heartbeat
  cancel-in-progress: false

jobs:
  check:
    name: Verify fresh production forecast
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: https://surf-video-share-tw.nolanasd123.workers.dev
    steps:
      - name: Verify completed near and far MFWAM collection slots
        shell: bash
        run: |
          set -euo pipefail
          # The Worker verifies all-spot completion with fifteen minutes of grace.
          # Unchanged snapshots retain their original time and still count as collected.
          status="$(curl --fail --silent --show-error --max-time 20 \
            "${BASE_URL}/api/v1/forecast-collection-status")"
          # An HTML fallback or incomplete response must never count as healthy.
          jq -e 'select([.checkedAt, .near.slotAt, .near.completedAt, .far.slotAt, .far.completedAt]
            | all(type == "string" and length > 0))' <<<"${status}"

  notify:
    name: Alert owner only when the forecast check fails
    if: ${{ always() && needs.check.result == 'failure' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      LINE_MESSAGING_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_MESSAGING_CHANNEL_ACCESS_TOKEN }}
      OPS_LINE_USER_ID: ${{ secrets.OPS_LINE_USER_ID }}
    steps:
      - name: Send a failure alert
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN}" || -z "${OPS_LINE_USER_ID}" ]]; then
            echo "LINE notification secrets are not configured."
            exit 1
          fi

          message='🚨MFWAM 最新批次未確認'

          payload="$(jq -cn --arg to "${OPS_LINE_USER_ID}" --arg text "${message}" \
            '{to: $to, messages: [{type: "text", text: $text}]}')"
          status="$(curl --silent --show-error --max-time 20 \
            --output /tmp/line-response.json --write-out '%{http_code}' \
            -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=UTF-8" \
            --data "${payload}")"
          if [[ ! "${status}" =~ ^2 ]]; then
            echo "LINE Messaging API rejected the forecast heartbeat with HTTP ${status}."
            exit 1
          fi
          echo "LINE forecast heartbeat sent."
